<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>404 — should you write tests? yes.</title>
    <meta
      name="robots"
      content="noindex"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><text x='16' y='24' text-anchor='middle' font-family='monospace' font-size='28' font-weight='700' fill='%233dcc73'>_</text></svg>"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      * {
        cursor: none !important;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @keyframes noise-shift {
        0% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-2px, 1px);
        }
        50% {
          transform: translate(1px, -2px);
        }
        75% {
          transform: translate(-1px, 2px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0;
        filter: drop-shadow(0 0 4px rgba(61, 204, 115, 0.7)) drop-shadow(0 0 10px rgba(61, 204, 115, 0.3));
      }

      .scanlines {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.07) 2px, rgba(0, 0, 0, 0.07) 4px);
        pointer-events: none;
        z-index: 50;
      }

      .grid-bg {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(rgba(61, 204, 115, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(61, 204, 115, 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        pointer-events: none;
        z-index: 0;
      }

      .vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, 0.82) 100%);
        pointer-events: none;
        z-index: 2;
      }

      .noise {
        position: fixed;
        inset: -4px;
        pointer-events: none;
        z-index: 1;
        opacity: 0.055;
        mix-blend-mode: screen;
        animation: noise-shift 0.12s steps(1) infinite;
      }

      .terminal {
        position: relative;
        z-index: 3;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 6vh 8vw;
        font-family: 'DM Mono', monospace;
      }

      .code {
        font-size: clamp(64px, 12vw, 120px);
        font-weight: 500;
        color: #ff5f57;
        line-height: 1;
        margin-bottom: 0.15em;
        min-height: 1.2em;
      }

      .msg {
        font-size: clamp(18px, 2.6vw, 24px);
        color: #e0e0e0;
        line-height: 1.7;
      }

      .sub {
        font-size: clamp(14px, 2vw, 18px);
        color: #555;
        margin-top: 0;
      }

      .blink {
        display: inline-block;
        width: 3px;
        height: 0.85em;
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: blink 1s step-end infinite;
      }

      .blink.red {
        background: #ff5f57;
      }
      .blink.green {
        background: #3dcc73;
      }

      .home-btn {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        font-family: 'DM Mono', monospace;
        font-size: clamp(15px, 2vw, 18px);
        color: #555;
        background: none;
        border: none;
        padding: 0;
        text-decoration: none;
        margin-top: 1.8em;
        transition: color 0.15s;
        opacity: 0;
      }
      .home-btn:hover {
        color: #3dcc73;
      }
      .home-btn {
        cursor: none !important;
      }

      .hint {
        position: fixed;
        bottom: 28px;
        left: 8vw;
        font-family: 'DM Mono', monospace;
        font-size: 16px;
        color: #444;
        z-index: 10;
      }
      .hint a {
        color: #3dcc73;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .hint a:hover {
        color: #5de88a;
      }
    </style>
  </head>
  <body>
    <div class="scanlines"></div>
    <div class="grid-bg"></div>
    <canvas
      class="noise"
      id="noise-canvas"
    ></canvas>
    <div class="vignette"></div>

    <svg
      id="cursor"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="24"
      viewBox="0 0 20 24"
    >
      <polygon
        points="3,1 3,19 7,14 10,21 12.5,20 9.5,13 16,13"
        fill="#3dcc73"
        stroke="#0c0c0c"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>

    <div class="terminal">
      <div
        class="code"
        id="el-code"
      >
        <span
          class="blink red"
          id="cur-code"
        ></span>
      </div>
      <div
        class="msg"
        id="el-msg"
      ></div>
      <div
        class="sub"
        id="el-sub"
      ></div>
      <button
        class="home-btn"
        id="el-home"
        onclick="window.location.href = '/'"
        style="
          display: inline-block;
          background: none;
          border: 1px solid #333;
          padding: 8px 20px;
          font-family: 'DM Mono', monospace;
          font-size: clamp(15px, 2vw, 18px);
          color: #555;
          transition:
            border-color 0.15s,
            color 0.15s;
          width: auto;
        "
      >
        take me home
      </button>
    </div>

    <div class="hint">
      <a href="/">shouldyouwritetests.com</a> &mdash; by
      <a
        href="https://x.com/dandigangi"
        target="_blank"
        rel="noopener noreferrer"
        >@dandigangi</a
      >
    </div>

    <script>
      ;(function () {
        const canvas = document.getElementById('noise-canvas')
        const ctx = canvas.getContext('2d')
        function resize() {
          canvas.width = innerWidth
          canvas.height = innerHeight
        }
        function generate() {
          const w = canvas.width,
            h = canvas.height
          const img = ctx.createImageData(w, h)
          const d = img.data
          for (let i = 0; i < d.length; i += 4) {
            const v = (Math.random() * 255) | 0
            d[i] = (v * 0.55) | 0
            d[i + 1] = v
            d[i + 2] = (v * 0.55) | 0
            d[i + 3] = 255
          }
          ctx.putImageData(img, 0, 0)
        }
        resize()
        generate()
        window.addEventListener('resize', () => {
          resize()
          generate()
        })
      })()

      const cur = document.getElementById('cursor')
      document.addEventListener('mousemove', (e) => {
        cur.style.left = e.clientX + 'px'
        cur.style.top = e.clientY + 'px'
        cur.style.opacity = '1'
      })

      function typeInto(el, text, speed, cursorEl, cursorClass, cb) {
        let i = 0
        if (cursorEl) {
          cursorEl.className = 'blink ' + cursorClass
          el.appendChild(cursorEl)
        }
        const tick = () => {
          if (i >= text.length) {
            if (cursorEl) cursorEl.remove()
            if (cb) cb()
            return
          }
          const node = document.createTextNode(text[i++])
          if (cursorEl) el.insertBefore(node, cursorEl)
          else el.appendChild(node)
          setTimeout(tick, speed + Math.random() * (speed * 0.3))
        }
        setTimeout(tick, 80)
      }

      const elCode = document.getElementById('el-code')
      const elMsg = document.getElementById('el-msg')
      const elSub = document.getElementById('el-sub')
      const elHome = document.getElementById('el-home')
      const curCode = document.getElementById('cur-code')

      typeInto(elCode, '404', 120, curCode, 'red', () => {
        setTimeout(() => {
          const curMsg = document.createElement('span')
          typeInto(elMsg, "this page doesn't exist.", 32, curMsg, 'green', () => {
            setTimeout(() => {
              const curSub = document.createElement('span')
              typeInto(elSub, 'i guess i should have wrote some tests.', 28, curSub, 'green', () => {
                setTimeout(() => {
                  elHome.style.opacity = '1'
                  elHome.addEventListener('mouseover', () => {
                    elHome.style.borderColor = '#3dcc73'
                    elHome.style.color = '#3dcc73'
                  })
                  elHome.addEventListener('mouseout', () => {
                    elHome.style.borderColor = '#333'
                    elHome.style.color = '#555'
                  })
                }, 200)
              })
            }, 150)
          })
        }, 300)
      })
    </script>
  </body>
</html>
