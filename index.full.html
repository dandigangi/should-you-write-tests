      html,

      @keyframes blink {

      .terminal-window {
        animation: glow-pulse 6s ease-in-out infinite;
      }

      .terminal-window.dragging {
        animation: none;
        box-shadow:
          0 0 80px 18px rgba(61, 204, 115, 0.11),
          0 0 0 1px #111;

      .terminal-line {

      .wordmark {
        font-size: clamp(20px, 6vw, 45px);
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.05;
        max-width: 100%;
        overflow: hidden;

      .tagline {
        font-size: clamp(10px, 2.2vw, 13px);

        letter-spacing: 0.3px;
        margin-top: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;

      #bg-text {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 0;
        padding: 2rem;
      }

      #bg-text span {
        font-family: 'DM Mono', monospace;
        font-size: clamp(48px, 10vw, 120px);
        font-weight: 500;
        color: rgba(61, 204, 115, 0.04);
        text-align: center;
        letter-spacing: -2px;
        line-height: 1.1;
        user-select: none;
      }

      .titlebar {
        background: #171717;
        border-radius: 10px 10px 0 0;
        padding: 10px 14px;
        display: flex;
        gap: 6px;
        align-items: center;
        border-bottom: 1px solid #222;
        cursor: grab;
        user-select: none;
      }

      .drag-icon {
        margin-left: auto;
        color: #444;
        font-size: 13px;
        line-height: 1;
      }

      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
      }

      .dot-red {
        background: #ff5f57;
      }
      .dot-yellow {
        background: #ffbd2e;
      }
      .dot-green {
        background: #28ca42;
      }

      #dot-tooltip {
        position: fixed;
        background: #ffbd2e;
        color: #0c0c0c;
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 9998;
        transform: translateX(-50%);
      }

      #dot-tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 4px solid transparent;
        border-top-color: #ffbd2e;
      }

      * {
        cursor: none !important;
      }

      #cursor,
      #cursor-pointer,
      #cursor-drag {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 9999;
        filter: drop-shadow(0 0 4px rgba(61, 204, 115, 0.7)) drop-shadow(0 0 10px rgba(61, 204, 115, 0.3));
        opacity: 0;
      }

      #cursor.active,
      #cursor-pointer.active,
      #cursor-drag.active {
        opacity: 1;
      }

      #cursor-drag.active {
        filter: drop-shadow(0 0 6px rgba(61, 204, 115, 0.9)) drop-shadow(0 0 16px rgba(61, 204, 115, 0.4));
      }

      #grid-symbols {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        font-family: 'DM Mono', monospace;
        font-size: 28px;
        font-weight: 500;
      }

      .grid-symbol {
        position: absolute;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      a:focus-visible {
        outline: 2px solid #3dcc73;
        outline-offset: 3px;
        border-radius: 2px;
      }
    </style>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React

      const lines = [
        { delay: 0, color: '#555', text: '$ npx jest --coverage --watchAll=false' },
        { delay: 400, color: '#3dcc73', text: '  ✓  renders without crashing (12ms)' },
        { delay: 650, color: '#3dcc73', text: '  ✓  handles empty state (3ms)' },
        { delay: 880, color: '#3dcc73', text: '  ✓  validates input correctly (8ms)' },
        { delay: 1100, color: '#3dcc73', text: '  ✓  submits form data (21ms)' },
        { delay: 1320, color: '#3dcc73', text: '  ✓  displays error messages (5ms)' },
        { delay: 1540, color: '#333', text: '  ──────────────────────────────────', mt: 8 },
        { delay: 1720, color: '#a3a3a3', text: '  Test Suites:  1 passed, 1 total' },
        { delay: 1920, color: '#a3a3a3', text: '  Tests:        5 passed, 5 total' },
        { delay: 2100, color: '#a3a3a3', text: '  Coverage:     94.2% statements' },
        { delay: 2300, color: '#a3a3a3', text: '  Time:         1.284s' },
        { delay: 2500, color: '#facc15', text: '  Verdict:  ✦ yes. write the tests.', mt: 10 },
      ]

      const aboutLines = [
        { color: '#555', text: '$ npx run story-time' },
        { color: '#a3a3a3', text: '' },
        { color: '#f0f0f0', text: '  once upon a time when ', xlink: true, after: " didn't have grey" },
        { color: '#f0f0f0', text: '  hair he had his first career "i broke production"' },
        { color: '#f0f0f0', text: '  moment. after many, many hours refactoring' },
        { color: '#f0f0f0', text: "  apartments.com's ad system dan shipped with ZERO" },
        { color: '#f0f0f0', text: '  tests. it might have been a friday too.' },
        { color: '#a3a3a3', text: '' },
        { color: '#f0f0f0', text: "  testing back then wasn't what it is today. the code" },
        { color: '#f0f0f0', text: '  went to production, had a fatal bug, and it cost the' },
        { color: '#f0f0f0', text: '  company about $70k in a few hours. great lesson but' },
        { color: '#f0f0f0', text: '  anyone that works with me now knows...' },
        { color: '#a3a3a3', text: '' },
        { color: '#facc15', text: "  if you don't test, you don't ship" },
        { color: '#a3a3a3', text: '' },
        { color: '#333', text: '  ──────────────────────────────────' },
        { color: '#3dcc73', text: '  ✓  tests written: 0 → many' },
      ]

      function AboutCursor() {
        const [typed, setTyped] = useState('')
        const msg = 'p.s. move the other terminal around'

        useEffect(() => {
          const timeout = setTimeout(() => {
            let i = 0
            const interval = setInterval(() => {
              setTyped(msg.slice(0, i + 1))
              i++
              if (i >= msg.length) clearInterval(interval)
            }, 45)
            return () => clearInterval(interval)
          }, 1000)
          return () => clearTimeout(timeout)
        }, [])

        return (
          <div
            aria-hidden='true'
            style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 16 }}
          >
            <span style={{ color: '#3dcc73', fontSize: 13 }}>❯</span>
            {typed && <span style={{ color: '#555', fontSize: 'clamp(12px, 2.4vw, 15px)', letterSpacing: -0.2 }}>{typed}</span>}
            <span
              style={{
                display: 'inline-block',
                width: 2,
                height: 15,
                background: '#3dcc73',
                verticalAlign: 'middle',
                animation: 'blink 1s step-end infinite',
              }}
            />
          </div>
        )
      }

      function App() {
        const [visible, setVisible] = useState([])
        const [done, setDone] = useState(false)
        const [pos, setPos] = useState(null)
        const [hidden, setHidden] = useState(false)
        const [showAbout, setShowAbout] = useState(false)
        const dragging = useRef(false)
        const dragOffset = useRef({ x: 0, y: 0 })
        const lockedWidth = useRef(null)
        const termRef = useRef(null)
        const placeholderRef = useRef(null)
        const tooltipTimer = useRef(null)

        useEffect(() => {
          lines.forEach((_, i) => {
            setTimeout(() => {
              setVisible((v) => [...v, i])
              if (i === lines.length - 1) setTimeout(() => setDone(true), 400)
            }, lines[i].delay)
          })
        }, [])

        function showTooltip(e) {
          const el = document.getElementById('dot-tooltip')
          if (!el) return
          const rect = e.currentTarget.getBoundingClientRect()
          el.textContent = 'coming soon after tests are completed'
          el.style.display = 'block'
          el.style.left = rect.left + rect.width / 2 + 'px'
          el.style.top = rect.top - 34 + 'px'
          clearTimeout(tooltipTimer.current)
          tooltipTimer.current = setTimeout(() => {
            el.style.display = 'none'
          }, 2500)
        }

        function hideTooltip() {
          clearTimeout(tooltipTimer.current)
          const el = document.getElementById('dot-tooltip')
          if (el) el.style.display = 'none'
        }

        function onTitlebarMouseDown(e) {
          if (e.target.closest('.dot')) return
          const rect = termRef.current.getBoundingClientRect()
          if (pos === null) {
            lockedWidth.current = termRef.current.offsetWidth
            const ph = placeholderRef.current
            if (ph) {
              ph.style.width = lockedWidth.current + 'px'
              ph.style.height = rect.height + 'px'
              ph.style.display = 'block'
            }
            dragOffset.current = { x: e.clientX - rect.left, y: e.clientY - rect.top }
            setPos({ x: rect.left, y: rect.top })
          } else {
            dragOffset.current = { x: e.clientX - pos.x, y: e.clientY - pos.y }
          }
          dragging.current = true
          termRef.current.classList.add('dragging')
          e.preventDefault()
        }

        useEffect(() => {
          function onMouseMove(e) {
            if (!dragging.current) return
            setPos({ x: e.clientX - dragOffset.current.x, y: e.clientY - dragOffset.current.y })
          }
          function onMouseUp() {
            if (!dragging.current) return
            dragging.current = false
            termRef.current && termRef.current.classList.remove('dragging')
          }
          window.addEventListener('mousemove', onMouseMove)
          window.addEventListener('mouseup', onMouseUp)
          return () => {
            window.removeEventListener('mousemove', onMouseMove)
            window.removeEventListener('mouseup', onMouseUp)
          }
        }, [])

        const termStyle =
          pos ?
            {
              position: 'fixed',
              left: pos.x,
              top: pos.y,
              zIndex: 5,
              width: lockedWidth.current ? lockedWidth.current + 'px' : undefined,
              borderRadius: 10,
              border: '1px solid #1a1a1a',
              visibility: hidden ? 'hidden' : 'visible',
              opacity: hidden ? 0 : 1,
              transition: 'opacity 0.2s ease',
            }
          : {
              position: 'relative',
              zIndex: 1,
              width: '100%',
              maxWidth: 667,
              marginTop: '1.5rem',
              borderRadius: 10,
              border: '1px solid #1a1a1a',
              visibility: hidden ? 'hidden' : 'visible',
              opacity: hidden ? 0 : 1,
              transition: 'opacity 0.2s ease',
            }

        return (
          <div
            style={{
              minHeight: '100vh',
              background: '#0c0c0c',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              fontFamily: "'DM Mono', monospace",
              position: 'relative',
              overflowX: 'hidden',
              padding: '2rem 1.25rem 5rem',
            }}
          >
            <div
              aria-hidden='true'
              id='grid-symbols'
            ></div>

            <div
              aria-hidden='true'
              style={{
                position: 'absolute',
                inset: 0,
                backgroundImage: 'linear-gradient(rgba(61,204,115,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(61,204,115,0.025) 1px, transparent 1px)',
                backgroundSize: '48px 48px',
                pointerEvents: 'none',
              }}
            />

            <div
              aria-hidden='true'
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                width: 600,
                height: 600,
                background: 'radial-gradient(ellipse, rgba(61,204,115,0.04) 0%, transparent 70%)',
                pointerEvents: 'none',
              }}
            />

            <header
              style={{
                position: 'relative',
                zIndex: 1,
                marginBottom: '2.5rem',
                textAlign: 'center',
                width: '100%',
                maxWidth: 667,
              }}
            >
              <p
                aria-hidden='true'
                style={{ fontSize: 11, color: '#444', letterSpacing: 3, textTransform: 'uppercase', marginBottom: 10 }}
              >
                $ run --should-you-write-tests
              </p>
              <h1 className='wordmark'>
                <span style={{ color: '#3dcc73' }}>shouldyouwrite</span>
                <span style={{ color: '#f0f0f0' }}>tests</span>
                <span
                  aria-hidden='true'
                  style={{ color: '#3dcc73', animation: 'blink 1s step-end infinite' }}
                >
                  _
                </span>
              </h1>
              <p className='tagline'>if you ain't testing, you ain't shipping to prod</p>
            </header>

            <footer
              style={{
                position: 'fixed',
                bottom: 0,
                left: 0,
                right: 0,
                padding: '28px',
                textAlign: 'center',
                zIndex: 10,
              }}
            >
              <span style={{ fontSize: 14, color: '#333', letterSpacing: 0.5 }}>
                <a
                  href='#'
                  onClick={(e) => {
                    e.preventDefault()
                    setShowAbout((v) => !v)
                  }}
                  style={{ color: showAbout ? '#3dcc73' : '#555', textDecoration: 'none', transition: 'color 0.2s' }}
                  onMouseEnter={(e) => (e.target.style.color = '#3dcc73')}
                  onMouseLeave={(e) => {
                    if (!showAbout) e.target.style.color = '#555'
                  }}
                >
                  about
                </a>
                <span style={{ color: '#444', margin: '0 10px' }}>—</span>
                made by{' '}
                <a
                  href='https://x.com/dandigangi'
                  target='_blank'
                  rel='noopener noreferrer'
                  aria-label='Dan DiGangi on X (opens in new tab)'
                  style={{ color: '#555', textDecoration: 'none', transition: 'color 0.2s' }}
                  onMouseEnter={(e) => (e.target.style.color = '#3dcc73')}
                  onMouseLeave={(e) => (e.target.style.color = '#555')}
                >
                  @dandigangi
                </a>
              </span>
            </footer>

            {showAbout && (
              <div
                onClick={() => setShowAbout(false)}
                style={{
                  position: 'fixed',
                  inset: 0,
                  background: 'rgba(0,0,0,0.75)',
                  zIndex: 20,
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                }}
              >
                <div
                  className='terminal-window'
                  onClick={(e) => e.stopPropagation()}
                  style={{
                    width: 'min(640px, calc(100vw - 2.5rem))',
                    borderRadius: 10,
                    border: '1px solid #1a1a1a',
                  }}
                >
                  <div
                    aria-hidden='true'
                    style={{
                      background: '#171717',
                      borderRadius: '10px 10px 0 0',
                      padding: '10px 14px',
                      display: 'flex',
                      alignItems: 'center',
                      borderBottom: '1px solid #222',
                    }}
                  >
                    <span style={{ fontSize: 11, color: '#444', letterSpacing: '0.03em' }}>story-time — zsh</span>
                    <button
                      onClick={() => setShowAbout(false)}
                      style={{
                        marginLeft: 'auto',
                        background: 'none',
                        border: 'none',
                        color: '#555',
                        fontSize: 18,
                        lineHeight: 1,
                        padding: '0 2px',
                        transition: 'color 0.2s',
                      }}
                      onMouseEnter={(e) => (e.target.style.color = '#3dcc73')}
                      onMouseLeave={(e) => (e.target.style.color = '#555')}
                      aria-label='Close'
                    >
                      ✕
                    </button>
                  </div>
                  <div
                    style={{
                      background: '#0f0f0f',
                      borderRadius: '0 0 10px 10px',
                      padding: '24px 26px 28px',
                      border: '1px solid #1c1c1c',
                      borderTop: 'none',
                      overflowX: 'hidden',
                    }}
                  >
                    {aboutLines.map((line, i) => (
                      <div
                        key={i}
                        className='terminal-line'
                        style={{
                          color: line.color,
                          lineHeight: line.text === '' ? '0' : undefined,
                          marginBottom: line.text === '' ? '12px' : undefined,
                        }}
                      >
                        {line.xlink ?
                          <>
                            {line.text}
                            <a
                              href='https://x.com/dandigangi'
                              target='_blank'
                              rel='noopener noreferrer'
                              style={{ color: '#3dcc73', textDecoration: 'none' }}
                              onMouseEnter={(e) => (e.target.style.textDecoration = 'underline')}
                              onMouseLeave={(e) => (e.target.style.textDecoration = 'none')}
                            >
                              dan digangi
                            </a>
                            {line.after}
                          </>
                        : line.text}
                      </div>
                    ))}
                    <AboutCursor />
                  </div>
                </div>
              </div>
            )}
            <div
              ref={placeholderRef}
              style={{ display: 'none', flexShrink: 0, marginTop: '1.5rem' }}
            />

            <main
              ref={termRef}
              className='terminal-window'
              aria-label='Jest test runner output'
              aria-live='polite'
              style={termStyle}
            >
              <div
                aria-hidden='true'
                className='titlebar'
                onMouseDown={onTitlebarMouseDown}
              >
                <div
                  className='dot dot-red'
                  onClick={() => setHidden(true)}
                />
                <div
                  className='dot dot-yellow'
                  onMouseEnter={showTooltip}
                  onMouseLeave={hideTooltip}
                ></div>
                <div
                  className='dot dot-green'
                  onMouseEnter={showTooltip}
                  onMouseLeave={hideTooltip}
                ></div>
                <span style={{ marginLeft: 10, fontSize: 11, color: '#444', letterSpacing: '0.03em' }}>jest — zsh</span>
                <span className='drag-icon'>⠿</span>
              </div>

              <div
                style={{
                  background: '#0f0f0f',
                  borderRadius: '0 0 10px 10px',
                  padding: '24px 26px 28px',
                  border: '1px solid #1c1c1c',
                  borderTop: 'none',
                  minHeight: 380,
                  overflowX: 'hidden',
                }}
              >
                {lines.map((line, i) => (
                  <div
                    key={i}
                    className='terminal-line'
                    style={{
                      color: line.color,
                      opacity: visible.includes(i) ? 1 : 0,
                      transform: visible.includes(i) ? 'translateY(0)' : 'translateY(4px)',
                      transition: 'opacity 0.2s ease, transform 0.2s ease',
                      marginTop: line.mt || 0,
                    }}
                  >
                    {line.text}
                  </div>
                ))}

                <div
                  aria-hidden='true'
                  style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 16 }}
                >
                  <span style={{ color: '#3dcc73', fontSize: 13 }}>❯</span>
                  <span
                    style={{
                      display: 'inline-block',
                      width: 2,
                      height: 15,
                      background: '#3dcc73',
                      verticalAlign: 'middle',
                      animation: 'blink 1s step-end infinite',
                    }}
                  />
                </div>
              </div>
            </main>
          </div>
        )
      }

      const CELL = 48

      function populateGrid() {
        const container = document.getElementById('grid-symbols')
        if (!container) return

        const cols = Math.floor(window.innerWidth / CELL)
        const rows = Math.floor(window.innerHeight / CELL)
        const totalCells = cols * rows
        const count = Math.floor(totalCells * 0.08)
        const used = new Set()

        for (let i = 0; i < count; i++) {
          let idx
          do {
            idx = Math.floor(Math.random() * totalCells)
          } while (used.has(idx))
          used.add(idx)

          const col = idx % cols
          const row = Math.floor(idx / cols)
          const isX = Math.random() < 0.25

          const el = document.createElement('div')
          el.className = 'grid-symbol'
          el.textContent = isX ? '✗' : '✓'
          el.style.left = col * CELL + 'px'
          el.style.top = row * CELL + 'px'
          el.style.color = isX ? 'rgba(61,204,115,0.10)' : 'rgba(61,204,115,0.12)'
          container.appendChild(el)
        }
      }

      populateGrid()

      const cursors = {
        default: document.getElementById('cursor'),
        pointer: document.getElementById('cursor-pointer'),
        drag: document.getElementById('cursor-drag'),
      }

      let activeCursor = cursors.default
      let isDragging = false

      function setActiveCursor(type) {
        Object.values(cursors).forEach((c) => {
          c.classList.remove('active')
          c.style.display = 'none'
        })
        activeCursor = cursors[type]
        activeCursor.style.display = 'block'
        activeCursor.classList.add('active')
      }

      function moveCursors(x, y) {
        cursors.default.style.left = x + 'px'
        cursors.default.style.top = y + 'px'
        cursors.pointer.style.left = x - 7 + 'px'
        cursors.pointer.style.top = y + 'px'
        cursors.drag.style.left = x - 10 + 'px'
        cursors.drag.style.top = y - 10 + 'px'
      }

      document.addEventListener('mousemove', (e) => {
        moveCursors(e.clientX, e.clientY)
        if (!activeCursor.classList.contains('active')) {
          activeCursor.classList.add('active')
        }
        if (isDragging) return
        const el = document.elementFromPoint(e.clientX, e.clientY)
        if (!el) return
        if (el.closest('.titlebar') && !el.closest('.dot')) {
          setActiveCursor('drag')
        } else if (el.closest('a') || el.closest('button') || el.closest('.dot-red')) {
          setActiveCursor('pointer')
        } else {
          setActiveCursor('default')
        }
      })

      document.addEventListener('mousedown', (e) => {
        const el = document.elementFromPoint(e.clientX, e.clientY)
        if (el && el.closest('.titlebar') && !el.closest('.dot')) {
          isDragging = true
          setActiveCursor('drag')
        }
      })

      document.addEventListener('mouseup', () => {
        isDragging = false
      })

      const root = ReactDOM.createRoot(document.getElementById('root'))
      root.render(<App />)
    </script>
  </body>
</html>
