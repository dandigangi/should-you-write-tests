        }
        50% {

        }
      }

      @keyframes glow-pulse {
        0%,
        100% {
          box-shadow:
            0 0 70px 15px rgba(61, 204, 115, 0.08),
            0 0 0 1px #111;
        }
        50% {
          box-shadow:
            0 0 90px 20px rgba(61, 204, 115, 0.13),
            0 0 0 1px #111;
        }
      }

      .terminal-window {
        animation: glow-pulse 6s ease-in-out infinite;
      }

      .terminal-line {
        font-size: clamp(12px, 2.4vw, 15px);
        letter-spacing: -0.2px;
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-all;
        overflow-wrap: break-word;

      .wordmark {
        font-size: clamp(18px, 5.5vw, 41px);
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.05;
        max-width: 100%;
        overflow: hidden;
      }

      .tagline {
        font-size: clamp(10px, 2.2vw, 13px);
        color: #facc15;
        letter-spacing: 0.3px;
        margin-top: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      * {
        cursor: none !important;
      }

      #cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 24px;
        height: 24px;
        pointer-events: none;
        z-index: 9999;
        filter: drop-shadow(0 0 4px rgba(61, 204, 115, 0.7)) drop-shadow(0 0 10px rgba(61, 204, 115, 0.3));
        transition: filter 0.15s ease;
        opacity: 0;
      }

      #cursor.clicking {
        filter: drop-shadow(0 0 6px rgba(61, 204, 115, 0.9)) drop-shadow(0 0 14px rgba(61, 204, 115, 0.5));
      }

      #grid-symbols {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        font-family: 'DM Mono', monospace;
        font-size: 28px;
        font-weight: 500;
      }

      .grid-symbol {
        position: absolute;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      a:focus-visible {
        outline: 2px solid #3dcc73;
        outline-offset: 3px;
        border-radius: 2px;
      }

  <body>
    <div id="root"></div>
    <svg
      id="cursor"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
    >
      <polygon
        points="4,2 4,20 8,16 11,22 13,21 10,15 16,15"
        fill="#3dcc73"
        stroke="#0c0c0c"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>

    <script type="text/babel">
      const { useState, useEffect } = React

      const lines = [
        { delay: 0, color: '#555', text: '$ npx jest --coverage --watchAll=false' },
        { delay: 400, color: '#3dcc73', text: '  ✓  renders without crashing (12ms)' },
        { delay: 650, color: '#3dcc73', text: '  ✓  handles empty state (3ms)' },
        { delay: 880, color: '#3dcc73', text: '  ✓  validates input correctly (8ms)' },
        { delay: 1100, color: '#3dcc73', text: '  ✓  submits form data (21ms)' },
        { delay: 1320, color: '#3dcc73', text: '  ✓  displays error messages (5ms)' },
        { delay: 1540, color: '#333', text: '  ──────────────────────────────────' },
        { delay: 1720, color: '#a3a3a3', text: '  Test Suites:  1 passed, 1 total' },
        { delay: 1920, color: '#a3a3a3', text: '  Tests:        5 passed, 5 total' },
        { delay: 2100, color: '#a3a3a3', text: '  Coverage:     94.2% statements' },
        { delay: 2300, color: '#a3a3a3', text: '  Time:         1.284s' },
        { delay: 2500, color: '#facc15', text: '  Verdict:  ✦ yes. write the tests.' },
      ]

      function App() {
        const [visible, setVisible] = useState([])
        const [done, setDone] = useState(false)

        useEffect(() => {
          lines.forEach((_, i) => {
            setTimeout(() => {
              setVisible((v) => [...v, i])
              if (i === lines.length - 1) setTimeout(() => setDone(true), 400)
            }, lines[i].delay)
          })
        }, [])

        return (
          <div
            style={{
              minHeight: '100vh',
              background: '#0c0c0c',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              justifyContent: 'center',
              fontFamily: "'DM Mono', monospace",
              position: 'relative',
              overflowX: 'hidden',
              padding: '2rem 1.25rem 5rem',
            }}
          >
            <div
              aria-hidden='true'
              id='grid-symbols'
            ></div>

            <div
              aria-hidden='true'
              style={{
                position: 'absolute',
                inset: 0,
                backgroundImage: 'linear-gradient(rgba(61,204,115,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(61,204,115,0.025) 1px, transparent 1px)',
                backgroundSize: '48px 48px',
                pointerEvents: 'none',
              }}
            />

            <div
              aria-hidden='true'
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                width: 600,
                height: 600,
                background: 'radial-gradient(ellipse, rgba(61,204,115,0.04) 0%, transparent 70%)',
                pointerEvents: 'none',
              }}
            />

            <header
              style={{
                position: 'relative',
                zIndex: 1,
                marginBottom: '2.5rem',
                textAlign: 'center',
                width: '100%',
                maxWidth: 667,
              }}
            >
              <p
                aria-hidden='true'
                style={{ fontSize: 11, color: '#444', letterSpacing: 3, textTransform: 'uppercase', marginBottom: 12 }}
              >
                $ run --should-you-write-tests
              </p>
              <h1 className='wordmark'>
                <span style={{ color: '#3dcc73' }}>shouldyouwrite</span>
                <span style={{ color: '#f0f0f0' }}>tests</span>
                <span
                  aria-hidden='true'
                  style={{ color: '#3dcc73', animation: 'blink 1s step-end infinite' }}
                >
                  _
                </span>
              </h1>
              <p className='tagline'>if you ain't testing, you ain't shipping to prod</p>
            </header>

            <footer
              style={{
                position: 'fixed',
                bottom: 0,
                left: 0,
                right: 0,
                padding: '28px',
                textAlign: 'center',
                zIndex: 10,
              }}
            >
              <span style={{ fontSize: 14, color: '#333', letterSpacing: 0.5 }}>
                made by{' '}
                <a
                  href='https://x.com/dandigangi'
                  target='_blank'
                  rel='noopener noreferrer'
                  aria-label='Dan DiGangi on X (opens in new tab)'
                  style={{ color: '#555', textDecoration: 'none', transition: 'color 0.2s' }}
                  onMouseEnter={(e) => (e.target.style.color = '#3dcc73')}
                  onMouseLeave={(e) => (e.target.style.color = '#555')}
                >
                  @dandigangi
                </a>
              </span>
            </footer>

            <main
              className='terminal-window'
              aria-label='Jest test runner output'
              aria-live='polite'
              style={{
                position: 'relative',
                zIndex: 1,
                width: '100%',
                maxWidth: 667,
                marginTop: '1.5rem',
                borderRadius: 10,
                border: '1px solid #1a1a1a',
              }}
            >
              <div
                aria-hidden='true'
                style={{
                  background: '#171717',
                  borderRadius: '10px 10px 0 0',
                  padding: '10px 14px',
                  display: 'flex',
                  gap: 6,
                  alignItems: 'center',
                  borderBottom: '1px solid #222',
                }}
              >
                <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#ff5f57', flexShrink: 0 }} />
                <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#ffbd2e', flexShrink: 0 }} />
                <div style={{ width: 11, height: 11, borderRadius: '50%', background: '#28ca42', flexShrink: 0 }} />
                <span style={{ marginLeft: 10, fontSize: 11, color: '#444', letterSpacing: '0.03em' }}>jest — zsh</span>
              </div>

              <div
                style={{
                  background: '#0f0f0f',
                  borderRadius: '0 0 10px 10px',
                  padding: '20px 22px',
                  border: '1px solid #1c1c1c',
                  borderTop: 'none',
                  minHeight: 322,
                  overflowX: 'hidden',
                }}
              >
                {lines.map((line, i) => (
                  <div
                    key={i}
                    className='terminal-line'
                    style={{
                      color: line.color,
                      opacity: visible.includes(i) ? 1 : 0,
                      transform: visible.includes(i) ? 'translateY(0)' : 'translateY(4px)',
                      transition: 'opacity 0.2s ease, transform 0.2s ease',
                    }}
                  >
                    {line.text}
                  </div>
                ))}

                {!done && (
                  <div
                    aria-hidden='true'
                    style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 4 }}
                  >
                    <span style={{ color: '#3dcc73', fontSize: 13 }}>❯</span>
                    <span
                      style={{
                        display: 'inline-block',
                        width: 2,
                        height: 15,
                        background: '#3dcc73',
                        verticalAlign: 'middle',
                        animation: 'blink 1s step-end infinite',
                      }}
                    />
                  </div>
                )}
              </div>
            </main>
          </div>
        )
      }

      const CELL = 48

      function populateGrid() {
        const container = document.getElementById('grid-symbols')
        if (!container) return

        const cols = Math.floor(window.innerWidth / CELL)
        const rows = Math.floor(window.innerHeight / CELL)
        const totalCells = cols * rows
        const count = Math.floor(totalCells * 0.08)
        const used = new Set()

        for (let i = 0; i < count; i++) {
          let idx
          do {
            idx = Math.floor(Math.random() * totalCells)
          } while (used.has(idx))
          used.add(idx)

          const col = idx % cols
          const row = Math.floor(idx / cols)
          const isX = Math.random() < 0.25

          const el = document.createElement('div')
          el.className = 'grid-symbol'
          el.textContent = isX ? '✗' : '✓'
          el.style.left = col * CELL + 'px'
          el.style.top = row * CELL + 'px'
          el.style.color = isX ? 'rgba(61,204,115,0.10)' : 'rgba(61,204,115,0.12)'
          container.appendChild(el)
        }
      }

      populateGrid()

      const cursor = document.getElementById('cursor')
      let mx = window.innerWidth / 2
      let my = window.innerHeight / 2

      document.addEventListener('mousemove', (e) => {
        mx = e.clientX
        my = e.clientY
        cursor.style.left = mx + 'px'
        cursor.style.top = my + 'px'
        cursor.style.opacity = '1'
      })

      document.addEventListener('mousedown', () => cursor.classList.add('clicking'))
      document.addEventListener('mouseup', () => cursor.classList.remove('clicking'))

      const root = ReactDOM.createRoot(document.getElementById('root'))
      root.render(<App />)
    </script>
