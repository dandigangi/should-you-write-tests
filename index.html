  <script>
    (function() {
      const canvas = document.getElementById('noise-canvas');
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
      function generate() {
        const w = canvas.width, h = canvas.height;
        const img = ctx.createImageData(w, h);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = Math.random() * 255 | 0;
          d[i]   = v * 0.55 | 0;
          d[i+1] = v;
          d[i+2] = v * 0.55 | 0;
          d[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      resize(); generate();
      let resizeTimer;
      window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { resize(); generate(); }, 200); });
    })();

    (function() {
      const wrap = document.getElementById('grid-symbols');
      const checkSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.6111L8.92308 17.5L20 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      const errorSvg = `<svg width="18" height="18" viewBox="-3.5 0 19 19" xmlns="http://www.w3.org/2000/svg"><path d="M11.383 13.644A1.03 1.03 0 0 1 9.928 15.1L6 11.172 2.072 15.1a1.03 1.03 0 1 1-1.455-1.456l3.928-3.928L.617 5.79a1.03 1.03 0 1 1 1.455-1.456L6 8.261l3.928-3.928a1.03 1.03 0 0 1 1.455 1.456L7.455 9.716z" fill="currentColor"/></svg>`;
      const C = 48, cols = Math.floor(innerWidth/C), rows = Math.floor(innerHeight/C);
      const total = cols * rows, count = Math.floor(total * 0.06), used = new Set();
      for (let n = 0; n < count; n++) {
        let idx; do { idx = Math.floor(Math.random()*total); } while(used.has(idx));
        used.add(idx);
        const el = document.createElement('div');
        const isX = Math.random() < 0.25;
        const color = isX ? 'rgba(61,204,115,0.15)' : 'rgba(61,204,115,0.18)';
        el.style.cssText = `position:absolute;width:48px;height:48px;display:flex;align-items:center;justify-content:center;left:${(idx%cols)*C}px;top:${Math.floor(idx/cols)*C}px;color:${color};`;
        el.innerHTML = isX ? errorSvg : checkSvg;
      wrap.appendChild(el);
      }
    })();

    const curD = document.getElementById('cursor');
    const curP = document.getElementById('cursor-pointer');
    const curPPath = document.getElementById('cursor-pointer-path');
    window.__lastClickX = innerWidth/2; window.__lastClickY = innerHeight/2;
    document.addEventListener('click', e => { window.__lastClickX = e.clientX; window.__lastClickY = e.clientY; });
    document.addEventListener('mousedown', () => {
      curD.style.filter = 'drop-shadow(0 0 8px rgba(61,204,115,1)) drop-shadow(0 0 20px rgba(61,204,115,0.8))';
      if (curPPath) { curPPath.setAttribute('fill','#3dcc73'); curPPath.setAttribute('stroke','#0a0a0a'); }
    });
    document.addEventListener('mouseup', () => {
      curD.style.filter = '';
      if (curPPath) { curPPath.setAttribute('fill','none'); curPPath.setAttribute('stroke','#3dcc73'); }
    });

    let mouseMoveScheduled = false;
    let lastMouseX = 0, lastMouseY = 0;
    document.addEventListener('mousemove', e => {
      lastMouseX = e.clientX; lastMouseY = e.clientY;
      if (mouseMoveScheduled) return;
      mouseMoveScheduled = true;
      requestAnimationFrame(() => {
        mouseMoveScheduled = false;
        curD.style.left = lastMouseX + 'px'; curD.style.top = lastMouseY + 'px';
        curP.style.left = (lastMouseX - 11) + 'px'; curP.style.top = (lastMouseY - 2) + 'px';
        const el = document.elementFromPoint(lastMouseX, lastMouseY);
        const el2 = el?.closest('.menu-item');
        const isLockedItem = el2 && el2.closest('.menu-wrap.locked') && !el2.classList.contains('chosen');
        const clickable = !isLockedItem && el?.closest('.menu-item,.submit-btn,.try-again-item,.restart-btn,.footer-right,.hint a,.home-btn');
        curD.style.display = clickable ? 'none' : 'block';
        curP.style.display = clickable ? 'block' : 'none';
        curD.style.opacity = curP.style.opacity = '1';
      });
    });

    let __audioCtx = null;
    let __masterGain = null;
    let __clickBuf = null;
    let __lastTick = 0;

    function __initAudio() {
      try {
        if (!__audioCtx || __audioCtx.state === 'closed') {
          __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          __masterGain = __audioCtx.createGain();
          __masterGain.gain.value = 0.6;
          __masterGain.connect(__audioCtx.destination);
          const bufSize = Math.floor(__audioCtx.sampleRate * 0.02);
          __clickBuf = __audioCtx.createBuffer(1, bufSize, __audioCtx.sampleRate);
          const data = __clickBuf.getChannelData(0);
          for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
        }
        if (__audioCtx.state === 'suspended') __audioCtx.resume();
      } catch(e) {}
    }

    document.addEventListener('click', __initAudio);
    document.addEventListener('keydown', __initAudio);
    document.addEventListener('touchstart', __initAudio);

    window.__playTick = function() {
      if (!__audioCtx || !__clickBuf || !__masterGain) return;
      const now = performance.now();
      if (now - __lastTick < 40) return;
      __lastTick = now;
      try {
        if (__audioCtx.state === 'suspended') { __audioCtx.resume(); return; }
        const src = __audioCtx.createBufferSource();
        src.buffer = __clickBuf;
        const filter = __audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1800 + Math.random() * 600;
        filter.Q.value = 0.9;
        const g = __audioCtx.createGain();
        const t = __audioCtx.currentTime;
        g.gain.setValueAtTime(0.035, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
        src.connect(filter); filter.connect(g); g.connect(__masterGain);
        src.start(t); src.stop(t + 0.02);
      } catch(e) {}
    };

    window.__playSelect = function(correct) {
      if (!__audioCtx || !__masterGain) return;
      try {
        if (__audioCtx.state === 'suspended') { __audioCtx.resume(); return; }
        const freqs = correct ? [220,330,440,550] : [440,330,220];
        freqs.forEach((freq, i) => {
          const osc = __audioCtx.createOscillator();
          const g = __audioCtx.createGain();
          osc.connect(g); g.connect(__masterGain);
          osc.frequency.value = freq; osc.type = 'square';
          const t = __audioCtx.currentTime + i * 0.08;
          g.gain.setValueAtTime(0.06, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
          osc.start(t); osc.stop(t + 0.1);
        });
      } catch(e) {}
    };

    const confettiCanvas = document.createElement('canvas');

    document.body.appendChild(confettiCanvas);
    const confCtx = confettiCanvas.getContext('2d');
    confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight;
    window.addEventListener('resize', () => { confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; });

    window.__confettiParticles = [];
    let confettiAnim = null;

    window.__triggerConfetti = function(originX, originY) {
      const ox = originX || innerWidth / 2;
      const oy = originY || innerHeight / 2;
      const colors = ['#3dcc73','#5de88a','#facc15','#f0f0f0','#a8f0c0'];
      for (let i = 0; i < 60; i++) {
        window.__confettiParticles.push({
          x: ox + (Math.random() - 0.5) * 80,
          y: oy,
          vx: (Math.random() - 0.5) * 14,
          vy: -(Math.random() * 12 + 6),
          size: Math.random() * 7 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8,
          gravity: 0.35,
          life: 1,
          decay: 0.012 + Math.random() * 0.008,
          shape: Math.random() > 0.5 ? 'rect' : 'circle',
        });
      }
      if (!confettiAnim) {
        (function animate() {
          confCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          window.__confettiParticles = window.__confettiParticles.filter(p => p.life > 0);
          window.__confettiParticles.forEach(p => {
            p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
            p.rotation += p.rotSpeed; p.life -= p.decay;
            confCtx.save();
            confCtx.globalAlpha = Math.max(0, p.life);
            confCtx.translate(p.x, p.y);
            confCtx.rotate(p.rotation * Math.PI / 180);
            confCtx.fillStyle = p.color;
            if (p.shape === 'rect') confCtx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
            else { confCtx.beginPath(); confCtx.arc(0, 0, p.size/2, 0, Math.PI*2); confCtx.fill(); }
            confCtx.restore();
          });
          if (window.__confettiParticles.length > 0) confettiAnim = requestAnimationFrame(animate);
          else { confettiAnim = null; confCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }
        })();
      }
    };

    window.__restartFn = null;
    window.__showRestartTooltip = null;
    window.__hasInteracted = false;
    document.getElementById('restart-btn').addEventListener('click', () => {
      if (window.__hasInteracted && window.__restartFn) window.__restartFn();
      else if (window.__showRestartTooltip) window.__showRestartTooltip();
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    function TypeLine({ text, cls, speed = 30, onDone, preDelay = 0 }) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      const onDoneRef = useRef(onDone);
      onDoneRef.current = onDone;

      useEffect(() => {
        let cancelled = false;
        const t = setTimeout(() => {
          if (cancelled) return;
          let i = 0;
          const tick = () => {
            if (cancelled) return;
            if (i >= text.length) { setDone(true); onDoneRef.current?.(); return; }
            setDisplayed(text.slice(0, ++i));
            if (window.__playTick) window.__playTick();
            setTimeout(tick, speed + Math.random() * (speed * 0.2));
          };
          tick();
        }, preDelay);
        return () => { cancelled = true; clearTimeout(t); };
      }, []);

      return (
        <div className={`line${cls ? ' '+cls : ''}`}>
          {displayed}{!done && <span className="cursor-blink" />}
        </div>
      );
    }

    function MenuItem({ opt, active, chosen, isNo, onHover, onClick, startSignal, onTypeDone }) {
      const full = `[${opt.key}] ${opt.label}`;
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      const started = useRef(false);
      const cbRef = useRef(onTypeDone);
      cbRef.current = onTypeDone;

      useEffect(() => {
        if (!startSignal || started.current) return;
        started.current = true;
        let i = 0, cancelled = false;
        const tick = () => {
          if (cancelled) return;
          if (i >= full.length) { setDone(true); cbRef.current?.(); return; }
          setDisplayed(full.slice(0, ++i));
          if (window.__playTick) window.__playTick();
          setTimeout(tick, 8 + Math.random() * 4);
        };
        tick();
        return () => { cancelled = true; };
      }, [startSignal]);

      const cls = ['menu-item', chosen?'chosen':active?'active':'', isNo?'no-item':''].filter(Boolean).join(' ');
      const bO = displayed[0]||'', k = displayed[1]||'', bC = displayed[2]||'', lbl = displayed.slice(3)||'';

      return (
        <div className={cls} style={{minHeight:'2em'}} onMouseEnter={onHover} onClick={onClick}>
          <span className="bracket">{bO}</span>
          <span className="key">{k}</span>
          <span className="bracket">{bC}</span>
          <span className="label">{lbl}</span>
          {!done && started.current && <span className="cursor-blink" />}
        </div>
      );
    }

    const ALL_OPTIONS = [
      { key:'1', label:'yes'                },
      { key:'2', label:'it depends'         },
      { key:'3', label:'no'                 },
      { key:'4', label:'show me the answer' },
      { key:'5', label:'do something else'   },
    ];

    const BEST_TESTS = [
      "expect(true).toBe(true);",
      "expect(1 + 1).toBe(2);",
      "expect('tests').not.toBe('optional');",
      "expect(prod).not.toThrow();",
      "expect(shipit).toBe(tested);",
      "expect(yourManager).not.toKnow(youBrokeIt);",
      "expect(coffee).toBeDefined();",
      "expect(deadline).toBeGreaterThan(testTime);",
      "expect(friday).not.toBe(deployDay);",
      "expect(coverage).toBeGreaterThanOrEqual(80);",
    ];

    function BestTest({ testIdx, onNext, onBack, runKey, onReady, isDone }) {
      const test = BEST_TESTS[testIdx];
      return (
        <div>
          <div className="line question">the best test(s) ever.</div>
          <div className="spacer" />
          <div style={{
            background: '#111',
            border: '1px solid #222',
            borderRadius: '6px',
            padding: '16px 52px 16px 20px',
            width: '80vw',
            maxWidth: '800px',
            minWidth: '280px',
            minHeight: '88px',
            position: 'relative',
            display: 'flex',
            flexDirection: 'column',
            justifyContent: 'center',
          }}>
            <div style={{fontSize:'11px',color:'#444',marginBottom:'10px',letterSpacing:'2px',textTransform:'uppercase'}}>jest</div>
            {!isDone ? (
              <TypeLine key={`bt-${runKey}-${testIdx}`} cls="green" speed={28} preDelay={0}
                text={test} onDone={onReady} />
            ) : (
              <div className="line green" style={{whiteSpace:'pre-wrap',wordBreak:'break-word',paddingRight:'8px'}}>{test}</div>
            )}
            {isDone && (
              <button onClick={onNext} style={{
                position:'absolute', right:'14px', top:'50%', transform:'translateY(-50%)',
                background:'none', border:'none', color:'#444', fontSize:'20px',
                padding:'4px 8px', transition:'color 0.15s', lineHeight:1,
              }}
              onMouseEnter={e => e.target.style.color='#3dcc73'}
              onMouseLeave={e => e.target.style.color='#444'}
              >→</button>
            )}
          </div>
          <div className="spacer" />
          <div className="try-again-item" onClick={onBack}>
            <span>[</span><span>b</span><span>]</span><span> go back</span>
          </div>
        </div>
      );
    }

    function App() {
      const [runKey, setRunKey]         = useState(0);
      const [phase, setPhase]           = useState('pre');
      const [visibleOpts, setVisibleOpts] = useState(ALL_OPTIONS);
      const [activeIdx, setActiveIdx]   = useState(0);
      const [chosenIdx, setChosenIdx]   = useState(null);
      const [typeItemIdx, setTypeItemIdx] = useState(-1);
      const [response, setResponse]     = useState(null);
      const [inputVal, setInputVal]     = useState('');
      const [emptyTooltip, setEmptyTooltip] = useState(false);
      const [dependsNo, setDependsNo]   = useState(false);
      const [tryAgain, setTryAgain]     = useState(false);
      const [coverageVal, setCoverageVal]   = useState('');
      const [coverageResult, setCoverageResult] = useState(null);
      const [coverageTooltip, setCoverageTooltip] = useState(false);
      const [interacted, setInteracted] = useState(false);
      const [restartTooltip, setRestartTooltip] = useState(false);
      const [elseMenuIdx, setElseMenuIdx] = useState(0);
      const [testIdx, setTestIdx] = useState(() => Math.floor(Math.random() * BEST_TESTS.length));
      const [askAiVal, setAskAiVal] = useState('');
      const [askAiTooltip, setAskAiTooltip] = useState(false);
      const [coverageKey, setCoverageKey] = useState(0);

      const menuActive  = phase === 'menu';
      const showDepends = ['depends-q','depends-input','depends-done'].includes(phase);
      const showElse    = ['else-q','else-q2','else-menu','coverage-input','coverage-done','about-typing','about-p2','about-p3','about-p4','about-done','ask-ai','ask-ai-done','best-test','best-test-done'].includes(phase);
      const showInput   = ['depends-input','depends-done'].includes(phase);
      const showAnyAlt  = showDepends || showElse;

      const restart = useCallback(() => {
        setRunKey(k => k + 1);
        setPhase('pre');
        setVisibleOpts(ALL_OPTIONS);
        setActiveIdx(0);
        setChosenIdx(null);
        setTypeItemIdx(-1);
        setResponse(null);
        setInputVal('');
        setEmptyTooltip(false);
        setDependsNo(false);
        setTryAgain(false);
        setInteracted(false);
        setCoverageVal('');
        setCoverageResult(null);
        setCoverageTooltip(false);
        setRestartTooltip(false);
        setElseMenuIdx(0);
        setTestIdx(Math.floor(Math.random() * BEST_TESTS.length));
        setCoverageKey(k => k + 1);
        setAskAiVal('');
        setAskAiTooltip(false);
        window.__hasInteracted = false;
        window.__confettiParticles = [];
        document.getElementById('restart-btn').disabled = true;
        setTimeout(() => setPhase('typing'), 30);
      }, []);

      useEffect(() => {
        window.__restartFn = restart;
        window.__showRestartTooltip = () => {
          setRestartTooltip(true);
          setTimeout(() => setRestartTooltip(false), 2500);
        };
      }, [restart]);

      useEffect(() => { setTimeout(() => setPhase('typing'), 30); }, []);

      function onQuestionDone() { setTypeItemIdx(0); }
      function onItemTypeDone(i) {
        if (i < visibleOpts.length - 1) setTypeItemIdx(i + 1);
        else setPhase('menu');
      }

      function selectOption(key) {
        if (!menuActive) return;
        const idx = visibleOpts.findIndex(o => o.key === key);
        if (idx === -1) return;
        if (!interacted) { setInteracted(true); window.__hasInteracted = true; document.getElementById('restart-btn').disabled = false; }
        setChosenIdx(idx); setResponse(null); setTryAgain(false); setPhase('responded');
        if (key === '1') {
          if (window.__playSelect) window.__playSelect(true);
          if (window.__triggerConfetti) window.__triggerConfetti(window.__lastClickX, window.__lastClickY);
          setTimeout(() => setResponse({ text:'this is the correct and only answer. good job.', cls:'green' }), 150);
        } else if (key === '2') {
          if (window.__playSelect) window.__playSelect(false);
          setTimeout(() => setPhase('depends-q'), 250);
        } else if (key === '3') {
          if (window.__playSelect) window.__playSelect(false);
          setTimeout(() => setResponse({ text:'wrong. write the tests.', cls:'red' }), 150);
        } else if (key === '4') {
          if (window.__playSelect) window.__playSelect(false);
          setChosenIdx(null); setVisibleOpts([{key:'1',label:'yes'}]); setActiveIdx(0); setPhase('menu');
          setTimeout(() => setResponse({ text:"this isn't hard but i made it easier for you. you're welcome.", cls:'muted' }), 150);
        } else if (key === '5') {
          if (window.__playSelect) window.__playSelect(false);
          setTryAgain(false);
          setResponse(null);
          setElseMenuIdx(0);
          setTimeout(() => setPhase('else-q'), 250);
        }
      }

      function submitCoverage() {
        const val = parseFloat(coverageVal);
        if (isNaN(val) || coverageVal.trim() === '') { setCoverageTooltip(true); return; }
        setCoverageTooltip(false);
        const clamped = Math.min(100, Math.max(0, val));
        const isHundo = clamped === 100;
        const isOver = val > 100;
        setCoverageResult(
          isOver ? "that's over 100% but i trust you. nice job."
          : isHundo ? 'you are the goat. 100% or bust.'
          : 'less than 100%. you need to step it up. go write some tests.'
        );
        setPhase('coverage-done');
      }

      function submitDepends() {
        if (!inputVal.trim()) { setEmptyTooltip(true); return; }
        setEmptyTooltip(false);
        setDependsNo(inputVal.trim().toLowerCase() === 'no');
        setPhase('depends-done');
      }

      useEffect(() => {
        function onKey(e) {
          if (e.key === 'Escape' || (e.key === 'r' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))) {
            if (interacted) restart(); return;
          }
          if (!menuActive) return;
          if (phase === 'else-menu') {
            const len = 5;
            if (e.key === 'ArrowUp' || e.key === 'k') setElseMenuIdx(i => (i - 1 + len) % len);
            else if (e.key === 'ArrowDown' || e.key === 'j') setElseMenuIdx(i => (i + 1) % len);
            else if (e.key === 'Enter' || e.key === ' ') {
              const phases = ['coverage-input','ask-ai','best-test','about-typing','follow'];
              const p = phases[elseMenuIdx];
              if (p === 'follow') window.open('https://x.com/dandigangi','_blank');
              else setPhase(p);
            }
            return;
          }
          if (e.key === 'ArrowUp' || e.key === 'k')
            setActiveIdx(i => (i - 1 + visibleOpts.length) % visibleOpts.length);
          else if (e.key === 'ArrowDown' || e.key === 'j')
            setActiveIdx(i => (i + 1) % visibleOpts.length);
          else if (e.key === 'Enter' || e.key === ' ')
            selectOption(visibleOpts[activeIdx].key);
          else if (['1','2','3','4'].includes(e.key)) {
            const o = visibleOpts.find(o => o.key === e.key);
            if (o) selectOption(o.key);
          }
        }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [menuActive, activeIdx, visibleOpts, interacted, restart, elseMenuIdx, phase]);

      const showMenu = !['pre','typing'].includes(phase) && !showDepends && !showElse;

      return (
        <div className="terminal">
          <div className="spacer" />

          {phase === 'pre' && <div className="line question glitch-q"><span className="cursor-blink" /></div>}

          {phase !== 'pre' && !showDepends && !showElse && (
            <TypeLine key={`q-${runKey}`} text="should you write tests?" cls="question glitch-q" speed={28} preDelay={400} onDone={onQuestionDone} />
          )}

          {!showAnyAlt && <div className="spacer" />}

          <div className={`menu-wrap${chosenIdx !== null ? ' locked' : ''}`} style={{ visibility: showMenu ? 'visible' : 'hidden', height: (showDepends || showElse) ? 0 : 'auto', overflow: 'hidden' }}>
            {visibleOpts.map((opt, i) => (
              <MenuItem
                key={`${opt.key}-${runKey}`}
                opt={opt}
                active={menuActive && activeIdx === i}
                chosen={chosenIdx === i}
                isNo={opt.key === '3'}
                onHover={() => { if (menuActive) setActiveIdx(i); }}
                onClick={e => { window.__lastClickX = e.clientX; window.__lastClickY = e.clientY; selectOption(opt.key); }}
                startSignal={typeItemIdx >= i}
                onTypeDone={() => onItemTypeDone(i)}
              />
            ))}
          </div>

          {!showAnyAlt && <div className="spacer" style={{ visibility: response ? 'visible' : 'hidden' }} />}
          <div style={{ minHeight:'1.7em', visibility: response && !showAnyAlt ? 'visible' : 'hidden' }}>
            {response && !showAnyAlt && (
              <TypeLine key={`r-${response.text}-${runKey}`} text={response.text} cls={response.cls} speed={30} preDelay={0}
                onDone={() => { if (phase !== 'menu') setTryAgain(true); }} />
            )}
          </div>

          {tryAgain && !showAnyAlt && (
            <>
              <div className="spacer" />
              <div className="try-again-item" onClick={restart}>
                <span>[</span><span>r</span><span>]</span><span> try again</span>
              </div>
            </>
          )}

          {showDepends && (
            <>
              {phase === 'depends-q' && (
                <TypeLine key={`dq-${runKey}`} text="why does it depend?" cls="question" speed={28} preDelay={150} onDone={() => setPhase('depends-input')} />
              )}
              {showInput && (
                <>
                  {phase !== 'depends-q' && <div className="line question">why does it depend?</div>}
                  <div className="spacer" />
                  {phase === 'depends-input' && (
                    <>
                      <div style={{position:'relative',display:'inline-block',width:'100%',maxWidth:'520px'}}>
                        {emptyTooltip && <div className="input-tooltip">why are you not putting your terrible answer??</div>}
                        <input className="terminal-input" autoFocus placeholder="type your excuse..."
                          value={inputVal}
                          onChange={e => { setInputVal(e.target.value); if (e.target.value.trim()) setEmptyTooltip(false); }}
                          onKeyDown={e => { if (e.key === 'Enter') submitDepends(); }}
                          style={{width:'100%',maxWidth:'100%'}} />
                      </div>
                      <div>
                        <button className={`submit-btn${inputVal.trim()?' valid':''}`} onClick={submitDepends}>submit answer</button>
                      </div>
                    </>
                  )}
                  {phase === 'depends-done' && (
                    <>
                      <TypeLine key={`dd-${runKey}`}
                        text={dependsNo ? "whew. i wasn't sure you were going to recover from this. good job." : 'it does not depend. idc what you said. go write some tests.'}
                        cls={dependsNo ? 'green' : 'red'} speed={30} preDelay={0}
                        onDone={() => setTryAgain(true)} />
                      {tryAgain && (
                        <>
                          <div className="spacer" />
                          <div className="try-again-item" onClick={restart}>
                            <span>[</span><span>r</span><span>]</span><span> try again</span>
                          </div>
                        </>
                      )}
                    </>
                  )}
                </>
              )}
            </>
          )}

          {showElse && (
            <>
              {phase === 'else-q' && (
                <TypeLine key={`eq-${runKey}`} text="i mean, you should be writing tests..." cls="" speed={28} preDelay={150}
                  onDone={() => setPhase('else-q2')} />
              )}
              {phase === 'else-q2' && (
                <>
                  <div className="line">i mean, you should be writing tests...</div>
                  <TypeLine key={`eq2-${runKey}`} text="but what do you want to do?" cls="" speed={28} preDelay={100}
                    onDone={() => setPhase('else-menu')} />
                </>
              )}
              {['else-menu','coverage-input','coverage-done'].includes(phase) && (
                <>
                  {phase === 'else-menu' && <div className="line">i mean, you should be writing tests...</div>}
                  {phase === 'else-menu' && <div className="line">but what do you want to do?</div>}
                  <div className="spacer" />
                  {phase === 'else-menu' && (() => {
                    const items = [
                      { label: 'test coverage checker',        action: () => setPhase('coverage-input') },
                      { label: 'ask ai',                        action: () => setPhase('ask-ai') },
                      { label: 'the best test(s) ever',         action: () => setPhase('best-test') },
                      { label: 'about this site',              action: () => setPhase('about-typing') },
                      { label: 'follow @dandigangi',           action: () => window.open('https://x.com/dandigangi','_blank') },
                    ];
                    return items.map((item, i) => (
                      <div key={i}
                        className={`menu-item${elseMenuIdx === i ? ' active' : ''}`}
                        style={{minHeight:'2em'}}
                        onMouseEnter={() => setElseMenuIdx(i)}
                        onClick={item.action}>
                        <span className="bracket">[</span>
                        <span className="key">{i+1}</span>
                        <span className="bracket">]</span>
                        <span className="label"> {item.label}</span>
                      </div>
                    ));
                  })()}
                  {phase === 'else-menu' && (
                    <div className="try-again-item" style={{marginTop:'1em'}} onClick={() => {
                      setChosenIdx(null); setResponse(null); setElseMenuIdx(0); setPhase('menu');
                    }}>
                      <span>[</span><span>b</span><span>]</span><span> go back</span>
                    </div>
                  )}
                  {['coverage-input','coverage-done'].includes(phase) && (
                    <>
                      <div className="line question">what's your test coverage?</div>
                      <div className="spacer" />

                      {(() => {
                        const v = parseFloat(coverageVal);
                        const valid = !isNaN(v) && coverageVal.trim() !== '';
                        const color = !valid ? '#555' : v >= 67 ? '#3dcc73' : v >= 34 ? '#facc15' : '#ff5f57';
                        return (
                          <div style={{position:'relative',display:'inline-block'}}>
                            {coverageTooltip && <div className="input-tooltip">enter a number between 0 and 100</div>}
                            <input
                              key={`cov-input-${coverageKey}`}
                              className="terminal-input coverage-input"
                              autoFocus
                              type="text"
                              inputMode="decimal"
                              placeholder="0.0"
                              value={coverageVal}
                              onChange={e => {
                                const raw = e.target.value;
                                if (raw === '' || raw === '.') { setCoverageVal(raw); return; }
                                const dotIdx = raw.indexOf('.');
                                if (dotIdx === -1) {
                                  if (/^\d{1,3}$/.test(raw)) { setCoverageVal(raw); if (!isNaN(parseFloat(raw))) setCoverageTooltip(false); }
                                } else {
                                  const [pre, post] = raw.split('.');
                                  if (/^\d{0,3}$/.test(pre) && /^\d{0,2}$/.test(post)) { setCoverageVal(raw); if (!isNaN(parseFloat(raw))) setCoverageTooltip(false); }
                                }
                              }}
                              onKeyDown={e => { if (e.key === 'Enter' && phase === 'coverage-input') submitCoverage(); }}
                              disabled={phase === 'coverage-done'}
                              style={{width:'160px', fontSize:'clamp(18px,2.6vw,24px)', fontWeight:500, color, borderBottomColor: color, transition:'color 0.3s, border-color 0.3s'}}
                            />
                            <span style={{fontSize:'clamp(18px,2.6vw,24px)',color,marginLeft:'4px',transition:'color 0.3s'}}>%</span>
                          </div>
                        );
                      })()}
                      {phase === 'coverage-input' && (
                        <>
                          <div>
                            <button className={`submit-btn${coverageVal.trim() && !isNaN(parseFloat(coverageVal)) ? ' valid' : ''}`}
                              onClick={submitCoverage}>check coverage</button>
                          </div>
                          <div className="spacer" />
                          <div className="try-again-item" onClick={() => { setPhase('else-menu'); setCoverageVal(''); setCoverageKey(k => k + 1); }}>
                            <span>[</span><span>b</span><span>]</span><span> go back</span>
                          </div>
                        </>
                      )}
                    </>
                  )}
                  {phase === 'coverage-done' && coverageResult && (
                    <>
                      <div className="spacer" />
                      <TypeLine key={`cr-${runKey}`}
                        text={coverageResult}
                        cls={coverageResult.includes('goat') || coverageResult.includes('trust') ? 'green' : 'red'}
                        speed={30} preDelay={0}
                        onDone={() => setTryAgain(true)} />
                      {tryAgain && (
                        <>
                          <div className="spacer" />
                          <div className="try-again-item" style={{marginBottom:'0.3em'}} onClick={() => { setCoverageVal(''); setCoverageResult(null); setCoverageKey(k => k + 1); setTryAgain(false); setPhase('coverage-input'); }}>
                            <span>[</span><span>r</span><span>]</span><span> try again</span>
                          </div>
                          <div className="try-again-item" onClick={() => { setPhase('else-menu'); setTryAgain(false); setCoverageVal(''); setCoverageResult(null); setCoverageKey(k => k + 1); }}>
                            <span>[</span><span>b</span><span>]</span><span> go back</span>
                          </div>
                        </>
                      )}
                    </>
                  )}
                </>
              )}
            </>
          )}

          {['ask-ai','ask-ai-done'].includes(phase) && (
            <>
              <div className="line question">ask ai about writing tests.</div>
              <div className="spacer" />
              {phase === 'ask-ai' && (
                <>
                  <div style={{position:'relative',display:'inline-block',width:'100%',maxWidth:'520px'}}>
                    {askAiTooltip && <div className="input-tooltip">say something. anything.</div>}
                    <input className="terminal-input" autoFocus placeholder="type your question..."
                      maxLength={120}
                      value={askAiVal}
                      onChange={e => { setAskAiVal(e.target.value); if (e.target.value.trim()) setAskAiTooltip(false); }}
                      onKeyDown={e => { if (e.key === 'Enter') {
                        if (!askAiVal.trim()) { setAskAiTooltip(true); return; }
                        setPhase('ask-ai-done');
                      }}}
                      style={{width:'100%',maxWidth:'100%'}} />
                    <div style={{fontSize:'11px',color:'#333',marginTop:'4px',textAlign:'right'}}>{askAiVal.length}/120</div>
                  </div>
                  <div>
                    <button className={`submit-btn${askAiVal.trim()?' valid':''}`} onClick={() => {
                      if (!askAiVal.trim()) { setAskAiTooltip(true); return; }
                      setPhase('ask-ai-done');
                    }}>ask</button>
                  </div>
                </>
              )}
              {phase === 'ask-ai-done' && (
                <>
                  <TypeLine key={`ai-${runKey}`}
                    text="why would i let you spend my tokens just to hear another yes? go write some tests."
                    cls="red" speed={28} preDelay={0}
                    onDone={() => {}} />
                  <div className="spacer" />
                  <div className="try-again-item" onClick={() => { setPhase('else-menu'); setAskAiVal(''); }}>
                    <span>[</span><span>b</span><span>]</span><span> go back</span>
                  </div>
                </>
              )}
              {phase === 'ask-ai' && (
                <>
                  <div className="spacer" />
                  <div className="try-again-item" onClick={() => { setPhase('else-menu'); setAskAiVal(''); }}>
                    <span>[</span><span>b</span><span>]</span><span> go back</span>
                  </div>
                </>
              )}
            </>
          )}

          {['best-test','best-test-done'].includes(phase) && (
            <BestTest
              testIdx={testIdx}
              onNext={() => { setTestIdx(i => (i + 1) % BEST_TESTS.length); setPhase('best-test'); }}
              onBack={() => setPhase('else-menu')}
              runKey={runKey}
              onReady={() => setPhase('best-test-done')}
              isDone={phase === 'best-test-done'}
            />
          )}

                    {['about-typing','about-p2','about-p3','about-p4','about-done'].includes(phase) && (
<div style={{maxWidth:'640px', maxHeight:'calc(100vh - 160px)', overflowY:'auto', msOverflowStyle:'none', scrollbarWidth:'none', lineHeight:'1.75'}}>
              <div className="spacer" />
              <div className="line" style={{marginBottom:'0.8em',fontSize:'clamp(18px,2.4vw,28px)',color:'#f0f0f0',fontWeight:500}}>about this site.</div>

              {phase === 'about-typing'
                ? <TypeLine key={`a1-${runKey}`} cls="about-p" speed={10} preDelay={0}
                    text={"once upon a time when dan digangi didn't have grey hair, he had his first career \"i broke production\" moment. after many, many hours refactoring apartments.com's ppc ad system dan shipped with ZERO tests. it might have been a friday too."}
                    onDone={() => setPhase('about-p2')} />
                : <div className="line about-p">{"once upon a time when dan digangi didn't have grey hair, he had his first career \"i broke production\" moment. after many, many hours refactoring apartments.com's ppc ad system dan shipped with ZERO tests. it might have been a friday too."}</div>
              }

              {['about-p2','about-p3','about-p4','about-done'].includes(phase) && (
                <>
                  <div className="spacer" />
                  {phase === 'about-p2'
                    ? <TypeLine key={`a2-${runKey}`} cls="about-p" speed={10} preDelay={60}
                        text={"testing back then wasn't what it is today. the code went to production, had a fatal bug, and it cost the company about $70k in a few hours. great lesson but anyone that works with me now knows..."}
                        onDone={() => setPhase('about-p3')} />
                    : <div className="line about-p">{"testing back then wasn't what it is today. the code went to production, had a fatal bug, and it cost the company about $70k in a few hours. great lesson but anyone that works with me now knows..."}</div>
                  }
                </>
              )}

              {['about-p3','about-p4','about-done'].includes(phase) && (
                <>
                  <div className="spacer" />
                  {phase === 'about-p3'
                    ? <TypeLine key={`a3-${runKey}`} cls="yellow" speed={18} preDelay={60}
                        text={"if you don't test, you don't ship."}
                        onDone={() => setPhase('about-p4')} />
                    : <div className="line yellow about-p">{"if you don't test, you don't ship."}</div>
                  }
                </>
              )}

              {['about-p4','about-done'].includes(phase) && (
                <>
                  <div className="spacer" />
                  {phase === 'about-p4'
                    ? <TypeLine key={`a4-${runKey}`} cls="about-p" speed={18} preDelay={60}
                        text={"write the tests and thank yourself later."}
                        onDone={() => setPhase('about-done')} />
                    : <div className="line about-p">{"write the tests and thank yourself later."}</div>
                  }
                </>
              )}

              {phase === 'about-done' && (
                <>
                  <div className="spacer" />
                  <div className="try-again-item" onClick={() => setPhase('else-menu')}>
                    <span>[</span><span>b</span><span>]</span><span> go back</span>
                  </div>
                </>
              )}
            </div>
          )}

          {restartTooltip && (
            <div className="restart-tooltip">you didn't do anything yet. wth.</div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
